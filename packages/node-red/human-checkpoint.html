<script type="text/javascript">
  RED.nodes.registerType('human-checkpoint-agent', {
    category: 'config',
    defaults: {
      name: { value: '' },
      moltNetUrl: { value: 'https://api.themolt.net', required: true },
      tokenUrl: { value: '', required: true },
      clientId: { value: '', required: true },
      teamId: { value: '', required: true },
    },
    credentials: {
      clientSecret: { type: 'password' },
      exaApiKey: { type: 'password' },
    },
    label: function () {
      return this.name || 'Human Checkpoint agent';
    },
  });
  for (const type of ['create', 'get']) {
    RED.nodes.registerType(`human-checkpoint-${type}`, {
      category: 'Human Checkpoint',
      color: '#d7ece9',
      defaults: {
        name: { value: '' },
        agent: { value: '', type: 'human-checkpoint-agent', required: true },
        checkpoint: {
          value: type === 'create' ? 'research-authorization' : '',
        },
        teamId: { value: '' },
        requestId: { value: '' },
      },
      inputs: 1,
      outputs: 1,
      icon: 'font-awesome/fa-key',
      label: function () {
        return this.name || `human-checkpoint-${type}`;
      },
    });
  }
  for (const type of ['research', 'release', 'proof', 'verify-proof']) {
    RED.nodes.registerType(`human-checkpoint-${type}`, {
      category: 'Human Checkpoint',
      color: '#d7ece9',
      defaults: {
        name: { value: '' },
        agent: { value: '', type: 'human-checkpoint-agent', required: true },
      },
      inputs: 1,
      outputs: 1,
      icon: 'font-awesome/fa-shield',
      label: function () {
        return this.name || `human-checkpoint-${type}`;
      },
    });
  }
  RED.nodes.registerType('human-checkpoint-workflow-load', {
    category: 'Human Checkpoint',
    color: '#d7ece9',
    defaults: { name: { value: '' } },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-database',
    label: function () {
      return this.name || 'Load durable workflow';
    },
  });
  for (const type of ['request-list', 'request-start']) {
    RED.nodes.registerType(`human-checkpoint-${type}`, {
      category: 'Human Checkpoint',
      color: '#d7ece9',
      defaults: { name: { value: '' } },
      inputs: 1,
      outputs: 1,
      icon: 'font-awesome/fa-list-alt',
      label: function () {
        return this.name || `human-checkpoint-${type}`;
      },
    });
  }
  RED.nodes.registerType('human-checkpoint-task-run', {
    category: 'Human Checkpoint',
    color: '#d7ece9',
    defaults: {
      name: { value: '' },
      agent: { value: '', type: 'human-checkpoint-agent', required: true },
      teamId: { value: '', required: true },
      diaryId: { value: '', required: true },
      runtimeProfileId: { value: '' },
      taskRole: { value: 'request-review', required: true },
      stepKey: { value: '', required: true },
      artifactKind: { value: '' },
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['completed result', 'live task status'],
    icon: 'font-awesome/fa-cogs',
    label: function () {
      return this.name || 'Run MoltNet agent task';
    },
  });
  RED.nodes.registerType('human-checkpoint-workflow-transition', {
    category: 'Human Checkpoint',
    color: '#d7ece9',
    defaults: {
      name: { value: '' },
      state: { value: '', required: true },
      currentStep: { value: '', required: true },
      eventType: { value: '', required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-exchange',
    label: function () {
      return this.name || 'Record workflow transition';
    },
  });
  RED.nodes.registerType('human-checkpoint-journey-view', {
    category: 'Human Checkpoint',
    color: '#d7ece9',
    defaults: {
      name: { value: '' },
      agent: { value: '', type: 'human-checkpoint-agent', required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-eye',
    label: function () {
      return this.name || 'Rebuild request view';
    },
  });
</script>
