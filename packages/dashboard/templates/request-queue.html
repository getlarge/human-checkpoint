<template>
  <main class="queue-workspace">
    <header>
      <div>
        <p class="product">Human Checkpoint</p>
        <h1>Service requests</h1>
        <p>
          Open assigned work, see what needs review, or look back at completed
          requests.
        </p>
      </div>
      <a class="secondary" href="/dashboard/ui/hardware-setup">YubiKey setup</a>
    </header>
    <div v-if="error" class="notice" role="alert">{{ error }}</div>
    <section class="queue-panel">
      <div class="queue-heading">
        <div>
          <h2>Demo service team</h2>
          <p>
            {{ filtered.length }} {{ activeLabel.toLowerCase() }} request{{
            filtered.length === 1 ? '' : 's' }}
          </p>
        </div>
        <nav aria-label="Request status">
          <button
            v-for="status in statuses"
            :key="status.value"
            :aria-pressed="active === status.value"
            @click="active = status.value"
          >
            {{ status.label }} <strong>{{ count(status.value) }}</strong>
          </button>
        </nav>
      </div>
      <div class="request-list">
        <article
          v-for="request in filtered"
          :key="request.id"
          :class="{ 'with-evidence': request.attachments?.length }"
        >
          <div class="request-copy">
            <div class="request-top">
              <strong>{{ request.id }}</strong
              ><span>{{ label(request.status) }}</span>
            </div>
            <p class="customer">{{ request.customerName }}</p>
            <h3>{{ request.assetName }}</h3>
            <p>{{ request.summary }}</p>
            <small
              >{{ request.siteName }} · Asset {{ request.assetId }} · {{
              date(request.openedAt) }}</small
            >
            <p v-if="request.confirmedResolution" class="outcome">
              Recorded outcome: {{ request.confirmedResolution }}
            </p>
            <button
              v-if="request.status === 'open'"
              :disabled="busy"
              @click="openRequest(request.id)"
            >
              Open assigned request
            </button>
          </div>
          <figure v-if="request.attachments?.length" class="request-evidence">
            <img
              :src="request.attachments[0].url"
              :alt="request.attachments[0].altText"
              loading="lazy"
            />
            <figcaption>
              <strong>{{ request.attachments.length }} reported photos</strong>
              <span>Request evidence · not analyzed by the agent</span>
            </figcaption>
          </figure>
        </article>
      </div>
    </section>
  </main>
</template>
<script>
  export default {
    data() {
      return { requests: [], active: 'open', busy: false, error: '' };
    },
    computed: {
      statuses() {
        return [
          { value: 'open', label: 'Open' },
          { value: 'pending-review', label: 'Pending review' },
          { value: 'closed', label: 'Closed' },
        ];
      },
      activeLabel() {
        return (
          this.statuses.find((item) => item.value === this.active)?.label ||
          this.active
        );
      },
      filtered() {
        return this.requests.filter(
          (request) => request.status === this.active,
        );
      },
    },
    watch: {
      msg: {
        handler(message) {
          const payload = message?.payload;
          if (payload?.kind === 'human-checkpoint:request-queue') {
            this.requests = payload.requests || [];
            this.busy = false;
            this.error = '';
          }
          if (payload?.kind === 'human-checkpoint:navigate')
            window.location.assign(payload.url);
          if (payload?.kind === 'human-checkpoint:error') {
            this.error = payload.detail;
            this.busy = false;
          }
        },
      },
    },
    mounted() {
      this.send({ topic: 'load-request-queue' });
    },
    methods: {
      count(status) {
        return this.requests.filter((request) => request.status === status)
          .length;
      },
      label(status) {
        return status === 'pending-review'
          ? 'Pending review'
          : status.charAt(0).toUpperCase() + status.slice(1);
      },
      date(value) {
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: 'medium',
        }).format(new Date(value));
      },
      openRequest(requestId) {
        this.busy = true;
        this.error = '';
        this.send({ topic: 'open-request', payload: { requestId } });
      },
    },
  };
</script>
