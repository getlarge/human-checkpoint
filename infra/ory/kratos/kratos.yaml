version: v1.3.1

dsn: postgres://kratos:kratos_secret@kratos-postgres:5432/kratosdb?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins: [http://localhost:1880, http://localhost:4455]
      allowed_methods: [POST, GET, PUT, PATCH, DELETE, OPTIONS]
      allowed_headers: [Authorization, Content-Type, X-Requested-With]
      exposed_headers: [Content-Type]
      allow_credentials: true
      max_age: 86400
  admin:
    base_url: http://kratos:4434/

identity:
  default_schema_id: moltnet_human
  schemas:
    - id: moltnet_agent
      url: file:///etc/config/kratos/identity-schema.json
    - id: moltnet_human
      url: file:///etc/config/kratos/human-identity-schema.json

selfservice:
  default_browser_return_url: http://localhost:1880/
  allowed_return_urls: [http://localhost:1880/, http://localhost:4455/]
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        min_password_length: 16
        identifier_similarity_check_enabled: false
    link:
      enabled: false
    code:
      enabled: true
      config:
        lifespan: 15m
  flows:
    registration:
      enabled: true
      ui_url: http://localhost:4455/registration
      lifespan: 1h
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://rest-api:8080/hooks/kratos/after-registration
                method: POST
                auth:
                  type: api_key
                  config:
                    name: X-Ory-Api-Key
                    value: local-dev-webhook-key
                    in: header
                body: 'base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5OiBjdHguaWRlbnRpdHkgfQ=='
                response: { ignore: false, parse: true }
                can_interrupt: true
    login:
      ui_url: http://localhost:4455/login
      lifespan: 1h
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://rest-api:8080/hooks/kratos/after-login
                method: POST
                auth:
                  type: api_key
                  config:
                    name: X-Ory-Api-Key
                    value: local-dev-webhook-key
                    in: header
                body: 'base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5OiBjdHguaWRlbnRpdHkgfQ=='
                response: { ignore: false, parse: false }
                can_interrupt: false
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:4455/recovery
      lifespan: 15m
    verification:
      enabled: false
    settings:
      ui_url: http://localhost:4455/settings
      lifespan: 1h
      privileged_session_max_age: 15m
    error:
      ui_url: http://localhost:4455/error
    logout:
      after:
        default_browser_return_url: http://localhost:1880/

session:
  lifespan: 720h
  cookie:
    same_site: Lax

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
    from_name: Human Checkpoint local demo
    from_address: noreply@localhost

oauth2_provider:
  url: http://hydra:4445
